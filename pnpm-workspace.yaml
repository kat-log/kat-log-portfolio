# pnpm の設定ファイル。ワークスペース(モノレポ)定義ではなく設定の置き場所として使う。
# pnpm 11 以降は package.json の "pnpm" フィールドを読まないため、こちらに置く必要がある。
# https://pnpm.io/settings

# pnpm 10 以降、依存パッケージの lifecycle script はデフォルトで実行されない。
# ビルドが必要な依存をここで明示的に許可する。
onlyBuiltDependencies:
  - '@sentry/cli' # ビルド時のソースマップアップロード
  - esbuild # Storybook / Vitest のバンドル
  - sharp # Next.js の画像最適化
  - unrs-resolver # eslint-config-next のモジュール解決

# 脆弱性のある推移的依存を上書きする。
# 親パッケージが古いバージョンを固定していて、直接依存の更新だけでは解消できないもののみを列挙する。
# 上流が範囲を広げたら、対応する行を削除すること。
overrides:
  # next が postcss を完全固定している (16.3.5 時点で 8.5.23 / GHSA: ReDoS ほか)
  next>postcss: ^8.5.26
  # @lhci/cli (Lighthouse CI, dev のみ) が古い tmp / uuid を引き込む
  tmp: ^0.2.6
  uuid: ^11.1.1
  # ajv (webpack>schema-utils 経由, Storybook dev のみ) が fast-uri@^3.0.1 で、
  # host confusion / SSRF が 3.1.6 未満で未修正
  # CVE-2026-75931 / 75975 / 75899 / 76172
  fast-uri: ^3.1.8
  # js-yaml の ReDoS (CVE-2026-84375)。eslint が 4.x、@lhci/cli が 3.x を引き込む
  js-yaml@3: ^3.15.2
  js-yaml@4: ^4.3.2
  # @lhci/cli>express が古い qs を引き込む (CVE-2026-82562 / 82417)
  qs: ^6.16.0
