# pnpm の設定ファイル。ワークスペース(モノレポ)定義ではなく設定の置き場所として使う。
# pnpm 11 以降は package.json の "pnpm" フィールドを読まないため、こちらに置く必要がある。
# https://pnpm.io/settings

# pnpm 10 以降、依存パッケージの lifecycle script はデフォルトで実行されない。
# ビルドが必要な依存をここで明示的に許可する。
onlyBuiltDependencies:
  - '@sentry/cli' # ビルド時のソースマップアップロード
  - esbuild # Storybook / Vitest のバンドル
  - sharp # Next.js の画像最適化
  - unrs-resolver # eslint-config-next のモジュール解決

# 脆弱性のある推移的依存を上書きする。
# 親パッケージが古いバージョンを固定していて、直接依存の更新だけでは解消できないもののみを列挙する。
# 上流が範囲を広げたら、対応する行を削除すること。
overrides:
  # next が postcss@8.4.31 を完全固定している (GHSA: ReDoS ほか)
  next>postcss: ^8.5.26
  # next の optionalDependencies が sharp@^0.34.5 で、libvips 由来の CVE が未修正
  # CVE-2026-33327 / 33328 / 35590 / 35591
  next>sharp: ^0.35.3
  # @lhci/cli (Lighthouse CI, dev のみ) が古い tmp / uuid を引き込む
  tmp: ^0.2.6
  uuid: ^11.1.1
